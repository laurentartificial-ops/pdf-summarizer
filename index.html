<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My PDF Summarizer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #fff; color: #111; min-height: 100vh; }
  header { border-bottom: 2px solid #111; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: 1px; }
  header span { font-size: 0.8rem; color: #555; }
  nav { display: flex; border-bottom: 1px solid #ddd; }
  nav button { flex: 1; padding: 12px; background: none; border: none; border-bottom: 3px solid transparent; font-size: 0.95rem; cursor: pointer; font-weight: 600; color: #555; }
  nav button.active { border-bottom: 3px solid #111; color: #111; }
  .page { display: none; padding: 32px; max-width: 960px; margin: 0 auto; }
  .page.active { display: block; }
  .upload-box { border: 2px dashed #bbb; border-radius: 10px; padding: 40px 20px; text-align: center; cursor: pointer; margin-bottom: 20px; }
  .upload-box:hover { border-color: #111; }
  .upload-box input { display: none; }
  .upload-box .icon { font-size: 2.5rem; margin-bottom: 10px; }
  .upload-box p { color: #555; font-size: 0.95rem; }
  .btn { display: block; width: 100%; padding: 14px; background: #111; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
  .btn:disabled { background: #aaa; cursor: not-allowed; }
  .btn-outline { background: #fff; color: #111; border: 2px solid #111; display: inline-block; width: auto; padding: 6px 14px; font-size: 0.85rem; border-radius: 5px; cursor: pointer; }
  .file-info { background: #f5f5f5; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; }
  .file-info span { flex: 1; }
  .section { margin-bottom: 32px; }
  .section h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid #111; }
  .section ul { list-style: none; }
  .section ul li { padding: 10px 0 10px 20px; border-bottom: 1px solid #eee; font-size: 1rem; position: relative; line-height: 1.8; }
  .section ul li::before { content: '•'; position: absolute; left: 0; }
  .section p { font-size: 1rem; line-height: 2; color: #222; }
  .loading { text-align: center; padding: 40px; }
  .spinner { width: 36px; height: 36px; border: 3px solid #ddd; border-top: 3px solid #111; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .history-item { border: 1px solid #ddd; border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
  .history-header { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; background: #fafafa; }
  .history-header:hover { background: #f0f0f0; }
  .history-title { font-weight: 600; font-size: 0.95rem; }
  .history-date { font-size: 0.8rem; color: #777; margin-top: 2px; }
  .history-body { display: none; padding: 16px; border-top: 1px solid #ddd; }
  .history-body.open { display: block; }
  .hm h3 { font-size: 0.9rem; font-weight: 700; margin: 12px 0 6px; }
  .hm ul { padding-left: 16px; }
  .hm ul li { font-size: 0.88rem; margin-bottom: 4px; line-height: 1.5; }
  .hm p { font-size: 0.88rem; line-height: 1.6; }
  .btn-del { background: #fff; color: #c00; border: 1px solid #c00; border-radius: 5px; padding: 7px 16px; font-size: 0.85rem; cursor: pointer; margin-top: 12px; }
  .empty { text-align: center; padding: 60px 20px; color: #aaa; font-size: 1rem; }
</style>
</head>
<body>

<header>
  <h1>📄 My PDF Summarizer</h1>
  <span>Simple. Clear. Easy.</span>
</header>

<nav>
  <button class="active" id="nav-upload" onclick="showPage('upload')">📤 Upload</button>
  <button id="nav-history" onclick="showPage('history')">🗂️ My Folder</button>
</nav>

<div id="page-upload" class="page active">
  <br>
  <div class="upload-box" onclick="document.getElementById('pdfInput').click()">
    <div class="icon">📂</div>
    <p><strong>Click to choose a PDF file</strong></p>
    <p style="margin-top:6px;font-size:0.85rem;">Max 50 pages</p>
    <input type="file" id="pdfInput" accept=".pdf">
  </div>

  <div id="fileInfo" style="display:none" class="file-info">
    <span>📄 <span id="fileName"></span></span>
    <button class="btn-outline" onclick="clearFile()">✕ Remove</button>
  </div>

  <button class="btn" id="summarizeBtn" disabled id="summarizeBtn">✨ Summarize PDF</button>

  <div id="loadingArea" style="display:none" class="loading">
    <div class="spinner"></div>
    <p>Reading your PDF...</p>
  </div>

  <div id="output" style="display:none">
    <hr style="margin:24px 0;border-color:#ddd;">
    <div class="section"><h2>🔑 Key Summary</h2><ul id="keyPoints"></ul></div>
    <div class="section"><h2>📖 Full Explanation</h2><p id="fullExplanation"></p></div>
    <div class="section"><h2>✅ What To Do</h2><ul id="whatToDo"></ul></div>
    <div class="section"><h2>🎯 Conclusion</h2><p id="conclusion"></p></div>
    <button class="btn" onclick="saveToHistory()">💾 Save to My Folder</button>
  </div>
</div>

<div id="page-history" class="page">
  <br>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
    <h2 style="font-size:1.1rem;">🗂️ My Folder</h2>
    <span id="historyCount" style="font-size:0.85rem;color:#777;"></span>
  </div>
  <div id="historyList"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let currentFile = null;
let currentSummary = null;

// File input
document.getElementById('pdfInput').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  currentFile = file;
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('fileInfo').style.display = 'flex';
  document.getElementById('summarizeBtn').disabled = false;
  document.getElementById('output').style.display = 'none';
  document.getElementById('loadingArea').style.display = 'none';
});

document.getElementById('summarizeBtn').addEventListener('click', summarize);

function clearFile() {
  currentFile = null;
  document.getElementById('pdfInput').value = '';
  document.getElementById('fileInfo').style.display = 'none';
  document.getElementById('summarizeBtn').disabled = true;
  document.getElementById('output').style.display = 'none';
}

function showPage(page) {
  document.getElementById('page-upload').classList.remove('active');
  document.getElementById('page-history').classList.remove('active');
  document.getElementById('nav-upload').classList.remove('active');
  document.getElementById('nav-history').classList.remove('active');
  document.getElementById('page-' + page).classList.add('active');
  document.getElementById('nav-' + page).classList.add('active');
  if (page === 'history') renderHistory();
}

async function extractText(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  const total = Math.min(pdf.numPages, 50);
  for (let i = 1; i <= total; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(' ') + '\n';
  }
  return text.trim();
}

async function summarize() {
  if (!currentFile) return;
  document.getElementById('loadingArea').style.display = 'block';
  document.getElementById('output').style.display = 'none';
  document.getElementById('summarizeBtn').disabled = true;

  try {
    const text = await extractText(currentFile);
    if (!text || text.length < 50) throw new Error('Cannot read this PDF. It might be a scanned image.');

    const prompt = `You are a smart analyst and teacher. Read this PDF and write a summary that is:
- Easy to understand (B1 English level) but KEEP all important numbers, percentages, data, names, and technical terms
- Do NOT simplify numbers — always include exact figures (e.g. "up 43%", "$2.1M revenue", "RSI at 62")
- Do NOT replace technical words with vague words (e.g. keep "on-chain metrics", "market cap", "RSI", "liquidity")
- Each key point must include specific data or facts from the PDF, not vague statements
- Full explanation must be detailed, at least 8-10 sentences, with numbers and specific facts included

Return ONLY a valid JSON object, nothing else, no markdown:
{
  "keyPoints": ["specific point with numbers/data 1", "specific point with numbers/data 2", "specific point with numbers/data 3", "specific point with numbers/data 4", "specific point with numbers/data 5"],
  "fullExplanation": "Detailed explanation with exact numbers, names, and technical terms kept. At least 8-10 sentences.",
  "whatToDo": ["specific action 1", "specific action 2", "specific action 3"],
  "conclusion": "Concise conclusion with key figures and facts."
}

PDF content:
${text.substring(0, 12000)}`;

    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer 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'
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        max_tokens: 2000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);

    const raw = data.choices[0].message.content;
    const clean = raw.replace(/```json|```/g, '').trim();
    const summary = JSON.parse(clean);

    currentSummary = { ...summary, fileName: currentFile.name };
    renderSummary(currentSummary);

  } catch(err) {
    document.getElementById('loadingArea').style.display = 'none';
    document.getElementById('summarizeBtn').disabled = false;
    alert('Error: ' + err.message);
  }
}

function renderSummary(s) {
  document.getElementById('loadingArea').style.display = 'none';
  document.getElementById('output').style.display = 'block';
  document.getElementById('summarizeBtn').disabled = false;
  document.getElementById('keyPoints').innerHTML = s.keyPoints.map(p => `<li>${p}</li>`).join('');
  document.getElementById('fullExplanation').textContent = s.fullExplanation;
  document.getElementById('whatToDo').innerHTML = s.whatToDo.map(p => `<li>${p}</li>`).join('');
  document.getElementById('conclusion').textContent = s.conclusion;
}

function saveToHistory() {
  if (!currentSummary) return;
  const history = getHistory();
  history.unshift({
    id: Date.now(),
    fileName: currentSummary.fileName,
    date: new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }),
    summary: {
      keyPoints: currentSummary.keyPoints,
      fullExplanation: currentSummary.fullExplanation,
      whatToDo: currentSummary.whatToDo,
      conclusion: currentSummary.conclusion
    }
  });
  try {
    localStorage.setItem('pdf_history', JSON.stringify(history));
    alert('✅ Saved!');
  } catch(e) { alert('Storage full! Delete some old summaries.'); }
}

function getHistory() {
  try { return JSON.parse(localStorage.getItem('pdf_history') || '[]'); }
  catch { return []; }
}

function renderHistory() {
  const history = getHistory();
  document.getElementById('historyCount').textContent = history.length + ' file(s)';
  const container = document.getElementById('historyList');
  if (!history.length) { container.innerHTML = '<div class="empty">No summaries yet.<br>Upload a PDF to get started!</div>'; return; }
  container.innerHTML = history.map((e, i) => `
    <div class="history-item">
      <div class="history-header" onclick="document.getElementById('hb${i}').classList.toggle('open')">
        <div><div class="history-title">📄 ${e.fileName}</div><div class="history-date">🕐 ${e.date}</div></div>
        <span>▾</span>
      </div>
      <div class="history-body hm" id="hb${i}">
        <h3>🔑 Key Summary</h3><ul>${e.summary.keyPoints.map(p=>`<li>${p}</li>`).join('')}</ul>
        <h3>📖 Full Explanation</h3><p>${e.summary.fullExplanation}</p>
        <h3>✅ What To Do</h3><ul>${e.summary.whatToDo.map(p=>`<li>${p}</li>`).join('')}</ul>
        <h3>🎯 Conclusion</h3><p>${e.summary.conclusion}</p>
        <button class="btn-del" onclick="deleteEntry(${e.id})">🗑️ Delete</button>
      </div>
    </div>`).join('');
}

function deleteEntry(id) {
  if (!confirm('Delete this summary?')) return;
  localStorage.setItem('pdf_history', JSON.stringify(getHistory().filter(e => e.id !== id)));
  renderHistory();
}
</script>
</body>
</html>
